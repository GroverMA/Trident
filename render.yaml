services:
  - type: web
    name: trident-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: TRIDENT_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: trident-postgres
          property: connectionString

  - type: web
    name: trident-web
    runtime: docker
    plan: free
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: TRIDENT_API_URL
        fromService:
          type: web
          name: trident-api
          property: hostport

databases:
  - name: trident-postgres
    plan: free
    databaseName: trident
    user: trident
