name: trident-cn

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4); assert json.load(r)['status'] == 'ready'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TRIDENT_API_URL: http://api:8000
    expose: ["3000"]
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, api]
